<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي العضلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap">
<style>
/* التصميم: لوحة تشريح سريرية — المجسّم في جهة، والسؤال والبطاقة في الجهة الثانية */
:root {
  --bg: #edf1f1;          /* خلفية رمادية مائلة للأزرق */
  --panel: #f8fafa;
  --fg: #1c2a2d;          /* لون النص */
  --muted: #5c6d70;
  --line: #d3dcdc;
  --skin: #e6d5c8;        /* لون الجلد في المجسّم */
  --skin-shade: #d6c1b2;
  --muscle: #c46a66;      /* لون العضلة */
  --muscle-hi: #a8484c;   /* العضلة عند المرور عليها */
  --muscle-line: #8f3d40;
  --accent: #1f6f78;      /* لون الأزرار */
  --accent-ink: #ffffff;
  --ok: #2f8a63;          /* إجابة صحيحة */
  --bad: #d08a2e;         /* إجابة خاطئة */
  --fiber: rgba(90, 25, 30, .38); /* لون خطوط الألياف */
  --hair: #4a3328;        /* لون الشعر */
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-latin: "Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181a; --panel: #182225; --fg: #e4ecec; --muted: #93a5a8; --line: #2a3a3e;
    --skin: #3b3431; --skin-shade: #4a403b; --muscle: #b25a5c; --muscle-hi: #d0767a; --muscle-line: #6e2d31;
    --accent: #55b4bd; --accent-ink: #0d1517; --ok: #4cbf8c; --bad: #e5a24b;
    --fiber: rgba(20, 5, 8, .45); --hair: #241a16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181a; --panel: #182225; --fg: #e4ecec; --muted: #93a5a8; --line: #2a3a3e;
  --skin: #3b3431; --skin-shade: #4a403b; --muscle: #b25a5c; --muscle-hi: #d0767a; --muscle-line: #6e2d31;
  --accent: #55b4bd; --accent-ink: #0d1517; --ok: #4cbf8c; --bad: #e5a24b;
  --fiber: rgba(20, 5, 8, .45); --hair: #241a16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-inline: 16px; padding-block: 20px 32px;
}
.app {
  max-width: 1040px; margin-inline: auto;
  display: grid; gap: 20px 32px;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
  grid-template-areas: "top top" "q fig" "info fig";
  grid-template-rows: auto auto 1fr;
  align-items: start;
}
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.top h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; margin: 0; line-height: 1.2; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }

/* أزرار أنماط اللعب */
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.modes button {
  font: 500 .92rem var(--f-body); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* منطقة السؤال */
.q { grid-area: q; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.meta b { color: var(--fg); font-weight: 600; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-block: 10px 22px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.kicker { margin: 0; color: var(--muted); font-size: 1rem; }
.prompt { margin: 4px 0 0; font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.2; text-wrap: balance; font-family: var(--f-display); font-weight: 700; }
.prompt.latin { font-family: var(--f-latin); font-style: italic; font-weight: 500; direction: ltr; text-align: right; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
.result {
  margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 12px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
}
.result.good { border-color: var(--ok); }
.result.miss { border-color: var(--bad); }
.result span { flex: 1 1 200px; min-width: 0; font-weight: 500; }
.btn {
  font: 600 1rem var(--f-body); background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 8px; padding: 8px 20px; cursor: pointer;
}

/* المجسّم */
.fig { grid-area: fig; margin: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.fig svg { display: block; width: 100%; max-width: 100%; height: auto; max-height: 82vh; margin-inline: auto; }
.sex { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; margin-bottom: 10px; }
.sex .sep { width: 1px; height: 18px; background: var(--line); margin-inline: 6px; }
.sex button {
  font: 500 .88rem var(--f-body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer;
}
.sex button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); background: var(--panel); }
.fig figcaption { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 6px; }
.skin { fill: var(--skin); }
.shade { fill: var(--skin-shade); pointer-events: none; }
.decor { fill: none; stroke: var(--muscle-line); stroke-width: 1; opacity: .7; pointer-events: none; }
.hair { fill: var(--hair); }
.fiber-line { stroke: var(--fiber); stroke-width: .7; }
.tex, .gloss { pointer-events: none; }
.m { fill: var(--muscle); stroke: var(--muscle-line); stroke-width: .8; cursor: pointer; transition: fill .15s; }
.m.hov { fill: var(--muscle-hi); }
.m.sel { fill: var(--accent); }
.m.ok { fill: var(--ok); }
.m.bad { fill: var(--bad); }
.m.reveal { fill: var(--ok); animation: pulse .9s ease-in-out 3; }
.m:focus-visible { outline: none; stroke: var(--fg); stroke-width: 2.5; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .m.reveal { animation: none; } .bar i { transition: none; } }

/* بطاقة معلومات العضلة */
.info { grid-area: info; align-self: start; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.info h3 { margin: 0; font-family: var(--f-latin); font-style: italic; font-weight: 500; font-size: 1.6rem; direction: ltr; text-align: right; line-height: 1.2; }
.info .ar { margin: 2px 0 14px; font-family: var(--f-display); font-weight: 500; font-size: 1.1rem; }
.info dl { margin: 0; display: grid; gap: 10px; }
.info dt { font-size: .75rem; letter-spacing: .04em; color: var(--muted); }
.info dd { margin: 0; }
.info .en { color: var(--muted); font-size: .9rem; direction: ltr; unicode-bidi: isolate; }
.info .hint { margin: 0; color: var(--muted); }
.note { grid-area: auto; color: var(--muted); font-size: .8rem; margin: 0; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "q" "fig" "info"; grid-template-rows: auto; }
  .fig { position: static; }
  .fig svg { max-height: 70vh; }
}
</style>
</head>
<body>

<script>
/* =========================================================
   ١) البيانات: الأعصاب والعضلات
   تقدرين تضيفين عضلة جديدة بإضافة عنصر هنا + شكل في الرسمة بنفس id
   ========================================================= */
const NERVES = {
  accessory:        { ar: "العصب الإضافي (القحفي الحادي عشر)", en: "Accessory n. (CN XI)" },
  axillary:         { ar: "العصب الإبطي",               en: "Axillary n. (C5–C6)" },
  pectoral:         { ar: "العصبان الصدريان الإنسي والوحشي", en: "Medial & lateral pectoral nn. (C5–T1)" },
  longThoracic:     { ar: "العصب الصدري الطويل",         en: "Long thoracic n. (C5–C7)" },
  musculocutaneous: { ar: "العصب العضلي الجلدي",         en: "Musculocutaneous n. (C5–C7)" },
  radial:           { ar: "العصب الكعبري",               en: "Radial n. (C5–T1)" },
  pin:              { ar: "العصب بين العظمي الخلفي (فرع من الكعبري)", en: "Posterior interosseous n. (C7–C8)" },
  suprascapular:    { ar: "العصب فوق الكتف",             en: "Suprascapular n. (C5–C6)" },
  lowerSubscapular: { ar: "العصب تحت الكتف السفلي",       en: "Lower subscapular n. (C5–C6)" },
  thoracodorsal:    { ar: "العصب الصدري الظهري",          en: "Thoracodorsal n. (C6–C8)" },
  superiorGluteal:  { ar: "العصب الألوي العلوي",          en: "Superior gluteal n. (L4–S1)" },
  inferiorGluteal:  { ar: "العصب الألوي السفلي",          en: "Inferior gluteal n. (L5–S2)" },
  sciatic:          { ar: "العصب الوركي",                en: "Sciatic n. (L5–S2)" },
  thoracoabdominal: { ar: "الأعصاب الصدرية البطنية",      en: "Thoracoabdominal nn. (T7–T12)" },
  femoral:          { ar: "العصب الفخذي",                en: "Femoral n. (L2–L4)" },
  obturator:        { ar: "العصب السدادي",               en: "Obturator n. (L2–L4)" },
  deepFibular:      { ar: "العصب الشظوي العميق",          en: "Deep fibular n. (L4–L5)" },
  tibial:           { ar: "العصب الظنبوبي",              en: "Tibial n. (S1–S2)" }
};

const MUSCLES = [
  { id: "scm", latin: "Sternocleidomastoid", ar: "القصية الترقوية الخشائية", nerve: "accessory",
    action: "ثني الرقبة، وتدوير الرأس للجهة المعاكسة",
    clue: "تدوير الرأس للجهة المعاكسة" },
  { id: "trapezius", view: "both", latin: "Trapezius", ar: "شبه المنحرفة", nerve: "accessory",
    action: "العلوية ترفع لوح الكتف، والوسطى تقرّبه للعمود الفقري (Retraction)، والسفلية تخفضه",

/* =========================================================
   ٣) حالة اللعبة
   ========================================================= */
const state = { mode: "name", queue: [], index: 0, score: 0, streak: 0, locked: false };

const $ = id => document.getElementById(id);

function loadBest() {
  try { return Number(localStorage.getItem("muscle-best-" + state.mode)) || 0; } catch { return 0; }
}
function saveBest(value) {
  try { localStorage.setItem("muscle-best-" + state.mode, value); } catch {}
}

// خلط عشوائي (Fisher–Yates)
function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function clearColors() {
  document.querySelectorAll(".m").forEach(el => el.classList.remove("ok", "bad", "reveal", "sel"));
}

/* =========================================================
   ٤) بدء الجولة وعرض السؤال
   ========================================================= */
function startRound() {
  state.queue = shuffle(MUSCLES).slice(0, QUESTIONS_PER_ROUND);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  showQuestion();
}

function showQuestion() {
  clearColors();
  state.locked = false;
  $("result").hidden = true;
  $("result").className = "result";

  const exploring = state.mode === "explore";
  $("meta").hidden = exploring;
  document.querySelector(".bar").hidden = exploring;
  $("prompt").classList.remove("latin");

  if (exploring) {
    $("kicker").textContent = "وضع المذاكرة";
    $("prompt").textContent = "اضغطي على أي عضلة";
    $("sub").textContent = "تطلع لك بطاقتها: الاسم، الوظيفة، والعصب.";
    showHint("اختاري عضلة من المجسّم عشان تشوفين معلوماتها.");
    return;
  }

  const target = state.queue[state.index];
  // إذا العضلة مو في المنظر الحالي، نقلب المجسّم تلقائيًا
  if (target.view !== "both" && target.view !== currentView) setView(target.view);
  if (state.mode === "name") {
    $("kicker").textContent = "وين هذي العضلة؟";
    $("prompt").textContent = target.latin;
    $("prompt").classList.add("latin");
    $("sub").textContent = target.ar;
  } else if (state.mode === "action") {
    $("kicker").textContent = "أي عضلة مسؤولة عن…";
    $("prompt").textContent = target.clue;
    $("sub").textContent = "";
  } else {
    $("kicker").textContent = "اضغطي على عضلة يغذّيها…";
    $("prompt").textContent = NERVES[target.nerve].ar;
    $("sub").textContent = NERVES[target.nerve].en;
  }
  showHint("اضغطي على العضلة في المجسّم.");
  updateStats();
}

function updateStats() {
  const best = loadBest();
  $("progress").textContent = `سؤال ${Math.min(state.index + 1, QUESTIONS_PER_ROUND)} من ${QUESTIONS_PER_ROUND}`;
  $("score").textContent = state.score;
  $("streak").textContent = state.streak;
  $("best").textContent = `${best} / ${QUESTIONS_PER_ROUND}`;
  $("barFill").style.width = (state.index / QUESTIONS_PER_ROUND) * 100 + "%";
}

/* =========================================================
   ٥) لما تضغط على عضلة
   ========================================================= */
function onMuscleClick(id) {
  const clicked = findMuscle(id);

  if (state.mode === "explore") {
    clearColors();
    shapesOf(id).forEach(el => el.classList.add("sel"));
    showCard(clicked);
    return;
  }
  if (state.locked) return;
  state.locked = true;

  const target = state.queue[state.index];
  // في نمط العصب: أي عضلة يغذيها نفس العصب تعتبر صح
  const correct = state.mode === "nerve" ? clicked.nerve === target.nerve : clicked.id === target.id;

  if (correct) {
    state.score++;
    state.streak++;
    shapesOf(id).forEach(el => el.classList.add("ok"));
    $("resultText").textContent = "صح! " + (state.streak >= 3 ? `${state.streak} إجابات صح ورا بعض.` : "");
    $("result").classList.add("good");
    showCard(clicked);
  } else {
    state.streak = 0;
    shapesOf(id).forEach(el => el.classList.add("bad"));
    shapesOf(target.id).forEach(el => el.classList.add("reveal"));
    $("resultText").textContent = `هذي ${clicked.latin}. الجواب الصحيح ${target.latin}، وهو مظلّل بالأخضر.`;
    $("result").classList.add("miss");
    showCard(target);
  }

  $("nextBtn").textContent = state.index + 1 >= QUESTIONS_PER_ROUND ? "شوفي النتيجة" : "التالي";
  $("result").hidden = false;
  updateStats();
  $("nextBtn").focus({ preventScroll: true });
}

function next() {
  // بعد نهاية الجولة: زر "جولة جديدة"
  if (state.index >= QUESTIONS_PER_ROUND) { startRound(); return; }

  state.index++;
  if (state.index < QUESTIONS_PER_ROUND) { showQuestion(); return; }

  // نهاية الجولة
  clearColors();
  if (state.score > loadBest()) saveBest(state.score);
  updateStats();
  $("progress").textContent = "خلصت الجولة";
  $("kicker").textContent = "نتيجتك";
  $("prompt").textContent = `${state.score} من ${QUESTIONS_PER_ROUND}`;
  $("sub").textContent = state.score >= 9 ? "ممتاز! جاهزة للاختبار." : state.score >= 6 ? "حلو، جولة ثانية وتثبتينها." : "جربي وضع التصفّح شوي، وبعدين ارجعي.";
  $("resultText").textContent = "";
  $("result").className = "result";
  $("nextBtn").textContent = "جولة جديدة";
  $("result").hidden = false;
}

function showCard(m) {
  const n = NERVES[m.nerve];
  $("info").innerHTML = `

    <p class="ar">${m.ar}</p>
    <dl>
      <div><dt>الوظيفة</dt><dd>${m.action}</dd></div>
      <div><dt>العصب</dt><dd>${n.ar}<br><span class="en">${n.en}</span></dd></div>
    </dl>`;
}
function showHint(text) {
  $("info").innerHTML = `<p class="hint">${text}</p>`;
}

/* =========================================================
   ٧) ربط الأحداث (الضغط، المرور، الكيبورد، الأزرار)
   ========================================================= */
const svg = $("body");
svg.addEventListener("click", e => {
  const el = e.target.closest(".m");
  if (el) onMuscleClick(el.dataset.m);
});
svg.addEventListener("keydown", e => {
  const el = e.target.closest(".m");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onMuscleClick(el.dataset.m); }
});
// تظليل الجهتين مع بعض عند المرور
svg.addEventListener("pointerover", e => {
  const el = e.target.closest(".m");
  if (el) shapesOf(el.dataset.m).forEach(s => s.classList.add("hov"));
});
svg.addEventListener("pointerout", e => {
  const el = e.target.closest(".m");
  if (el) shapesOf(el.dataset.m).forEach(s => s.classList.remove("hov"));
});

$("nextBtn").addEventListener("click", next);

document.querySelectorAll(".modes button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b === btn));
    state.mode = btn.dataset.mode;
    startRound();

});

    const group = document.querySelector(`.view[data-view="${view}"]`);
    for (const [id, change] of Object.entries(body[view])) {
      // العضلة نفسها + طبقات الألياف والتظليل حقتها
      group.querySelectorAll(`[data-m="${id}"], [data-of="${id}"]`).forEach(el => {
        if (change.d) el.setAttribute("d", change.d);
        if ("transform" in change) {
          if (change.transform) el.setAttribute("transform", change.transform);
          else el.removeAttribute("transform");
        }
      });
    }
  }
  document.querySelectorAll(".sex button[data-body]").forEach(b => b.setAttribute("aria-pressed", b.dataset.body === kind));
  try { localStorage.setItem("muscle-body", kind); } catch {}
}

document.querySelectorAll(".sex button[data-body]").forEach(btn => {
  btn.addEventListener("click", () => setBody(btn.dataset.body));
});

/* =========================================================
   ٩) المنظر: من الأمام / من الخلف
   ========================================================= */
let currentView = "front";
function setView(view) {
  currentView = view;
  document.querySelectorAll(".view").forEach(g => g.style.display = g.dataset.view === view ? "" : "none");
  document.querySelectorAll(".sex button[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
  $("caption").textContent = view === "front"
    ? "منظر أمامي: يمين الجسم يظهر على يسار الشاشة"
    : "منظر خلفي: يسار الجسم يظهر على يسار الشاشة";
}
document.querySelectorAll(".sex button[data-view]").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

let savedBody = "female";
try { savedBody = localStorage.getItem("muscle-body") || "female"; } catch {}
setBody(BODIES[savedBody] ? savedBody : "female");

startRound();
</script>
